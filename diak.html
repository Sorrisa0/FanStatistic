<div class="container mt-5">
    <!-- 1. Bejelentkezési/Regisztrációs blokk (ha külön oldalon kezeled, vagy ha itt van) -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-6">
            <ul class="nav nav-pills mb-3 justify-content-center" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#loginPanel" type="button" role="tab">Belépés</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#registerPanel" type="button" role="tab">Regisztráció</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">
                <div class="tab-pane fade show active" id="loginPanel" role="tabpanel">
                    <div class="card shadow-sm p-4">
                        <h2 class="mb-3 text-center">Bejelentkezés</h2>
                        <div id="loginAlert" class="alert d-none" role="alert"></div>
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email cím</label>
                                <input type="email" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Jelszó</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Belépés</button>
                        </form>
                    </div>
                </div>

                <div class="tab-pane fade" id="registerPanel" role="tabpanel">
                    <div class="card shadow-sm p-4">
                        <h2 class="mb-3 text-center">Regisztráció</h2>
                        <div id="registerAlert" class="alert d-none" role="alert"></div>
                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email cím</label>
                                <input type="email" class="form-control" id="regEmail" required>
                                <div class="form-text">Érvényes email címet adjon meg.</div>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Jelszó</label>
                                <input type="password" class="form-control" id="regPassword" required>
                                <div class="form-text">Legalább 8 karakter, tartalmaznia kell kis- és nagybetűt is.</div>
                            </div>
                            <div class="mb-3">
                                <label for="regPasswordConfirm" class="form-label">Jelszó megerősítése</label>
                                <input type="password" class="form-control" id="regPasswordConfirm" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Regisztráció</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="SCRIPTS/regpassdiak.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
